<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AMBA GM</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="AMBA GM home"><span class="brand-mark">A</span><span>AMBA <b>GM</b></span></a>
    <div class="topbar-right"><span id="connection-state" class="connection-state">Not connected</span><a href="#" id="open-amba" class="quiet-link" target="_blank" rel="noreferrer">Open AMBA</a></div>
  </header>
  <main id="app" class="page">
    <section class="intro">
      <p class="eyebrow">PLAY NOW</p>
      <h1>Choose a module</h1>
      <p class="lede">Connect to AMBA and choose from the same module list you use in the authoring app.</p>
    </section>
    <p id="message" class="message" role="status" aria-live="polite"></p>
    <footer>Published adventure content stays owned by AMBA. Button-confirmed outcomes are recorded in AMBA GM.</footer>
  </main>
</body>
</html>
