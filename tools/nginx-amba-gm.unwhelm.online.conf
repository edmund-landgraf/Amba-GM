# Install: sudo cp tools/nginx-amba-gm.unwhelm.online.conf /etc/nginx/sites-available/amba-gm.unwhelm.online
#         sudo ln -sf /etc/nginx/sites-available/amba-gm.unwhelm.online /etc/nginx/sites-enabled/
#         sudo certbot --nginx -d amba-gm.unwhelm.online
#         sudo nginx -t && sudo systemctl reload nginx
# PM2: run Amba-GM from ~/node-sites/Amba-GM on PORT=3010 (Node 22.13+ via nvm).

server {
    listen 80;
    listen [::]:80;
    server_name amba-gm.unwhelm.online;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}