name: AMBA GM tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm test
      - name: Check client JavaScript syntax
        run: find public/src -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: node --check public/app.js && node --check tools/dev-server.mjs
