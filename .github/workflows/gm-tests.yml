name: AMBA GM tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm test
      - name: Check client JavaScript syntax
        run: find public/src server -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - run: node --check public/app.js && node --check tools/dev-server.mjs && node --check tools/browser-smoke.mjs

      - name: Install pinned browser test tooling
        run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium
      - name: Exercise campaign lifecycle in a real browser
        run: node tools/browser-smoke.mjs
